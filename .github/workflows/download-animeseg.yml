name: Download AnimeSeg v3 model
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download model from Hugging Face
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Models
          curl --fail --location --retry 5 --retry-delay 5 --connect-timeout 30 \
            --output Models/anime_seg_mask2former_v3.safetensors \
            "https://huggingface.co/suzukimain/AnimeSeg/resolve/main/models/anime_seg_mask2former_v3.safetensors?download=true"
      - name: Verify safetensors header and record SHA256
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          p = Path("Models/anime_seg_mask2former_v3.safetensors")
          size = p.stat().st_size
          if size < 100_000_000:
              raise RuntimeError(f"Model unexpectedly small: {size} bytes")
          with p.open("rb") as f:
              n = struct.unpack("<Q", f.read(8))[0]
              if not 2 <= n <= 100_000_000 or n + 8 >= size:
                  raise RuntimeError("Invalid safetensors header length")
              header = json.loads(f.read(n))
          tensors = [k for k in header if k != "__metadata__"]
          if not tensors:
              raise RuntimeError("No model tensors found")
          h = hashlib.sha256()
          with p.open("rb") as f:
              for chunk in iter(lambda: f.read(4 * 1024 * 1024), b""):
                  h.update(chunk)
          info = {"bytes": size, "sha256": h.hexdigest(), "tensor_count": len(tensors)}
          Path("Models/anime_seg_mask2former_v3.verified.json").write_text(json.dumps(info, indent=2))
          print(info)
          PY
      - name: Upload verified model
        uses: actions/upload-artifact@v4
        with:
          name: AnimeSeg-v3-weights
          path: Models/
          if-no-files-found: error
          retention-days: 7
